
services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j_mem0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant_mem0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: redis_session
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: postgres_mem0
    environment:
      POSTGRES_DB: mem0_history
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0_history"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  neo4j_data:
  qdrant_data:
  redis_data:
  postgres_data: